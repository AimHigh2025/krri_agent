{% extends "base.html" %}
{% block title %}{{ 'KPI 항목 수정' if item else 'KPI 항목 등록' }} - KRRI KPI 대시보드{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ 'KPI 항목 수정' if item else 'KPI 항목 등록' }}</h1>
  </div>
</div>

<div class="form-card">
  <form method="post">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">항목명 *</label>
        <input type="text" class="form-control" name="name" required value="{{ item.name if item else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">설명</label>
        <input type="text" class="form-control" name="description" value="{{ item.description if item and item.description else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">가중치 (%) *</label>
        <input type="number" step="0.1" min="0" max="100" class="form-control" name="weight" required value="{{ item.weight if item else 10 }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">단위</label>
        <input type="text" class="form-control" name="unit" placeholder="예: 건, %, 점" value="{{ item.unit if item and item.unit else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">평가 방향</label>
        <select class="form-select" name="direction">
          <option value="higher" {% if not item or item.direction == 'higher' %}selected{% endif %}>높을수록 좋음</option>
          <option value="lower" {% if item and item.direction == 'lower' %}selected{% endif %}>낮을수록 좋음</option>
        </select>
      </div>
      {% if item %}
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="active" id="active" {% if item.active %}checked{% endif %}>
          <label class="form-check-label" for="active">평가에 사용 (활성)</label>
        </div>
      </div>
      {% endif %}
    </div>
    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary">저장</button>
      <a href="{{ url_for('kpi_list') }}" class="btn btn-outline-secondary">취소</a>
    </div>
  </form>
</div>
{% endblock %}
